services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: dev1234
      POSTGRES_DB: devboard
    volumes:
      - /init/postgres:/var/lib/postgresql/data
      
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  backend:
    build: ./backend
    container_name: devboard-backend
    environment:
      DATABASE_URL: postgres://${devboard}:${dev1234}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: devboard-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:4173"